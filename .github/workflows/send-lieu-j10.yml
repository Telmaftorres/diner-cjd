name: Envoi du lieu aux inscrits

# Déclenchement manuel uniquement : le lieu est dévoilé au dernier moment et
# change d'un dîner à l'autre. Depuis l'onglet Actions de GitHub, lancer ce
# workflow en renseignant la date du dîner, le lieu et l'horaire.

on:
  workflow_dispatch:
    inputs:
      dateId:
        description: "Date du dîner (format AAAA-MM-JJ, ex. 2026-10-01)"
        required: true
      lieu:
        description: "Lieu exact (adresse complète)"
        required: true
      horaire:
        description: "Horaire"
        required: false
        default: "19h"

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Envoyer le lieu aux inscrits
        run: |
          curl -fsS -X POST ${{ secrets.APP_URL }}/api/admin/send-lieu \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg dateId '${{ github.event.inputs.dateId }}' \
              --arg lieu '${{ github.event.inputs.lieu }}' \
              --arg horaire '${{ github.event.inputs.horaire }}' \
              --arg adminSecret '${{ secrets.ADMIN_SECRET }}' \
              '{dateId: $dateId, lieu: $lieu, horaire: $horaire, adminSecret: $adminSecret}')"
