name: Envoi du lieu aux inscrits (J-10)

# Chaque jour : si un dîner a lieu dans exactement 10 jours, l'email « le lieu
# se dévoile » part aux inscrits, avec le lieu renseigné dans diner_infos.
# Si le lieu n'est pas renseigné, rien ne part (l'appel répond juste "Lieu non
# renseigné"). On peut aussi déclencher l'envoi à la main depuis /admin.

on:
  schedule:
    - cron: '30 8 * * *'
  workflow_dispatch:
    inputs:
      dateId:
        description: "Date du dîner (AAAA-MM-JJ) — laisser vide pour J-10 automatique"
        required: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Envoyer le lieu aux inscrits
        run: |
          DATE_ID="${{ github.event.inputs.dateId }}"
          if [ -z "$DATE_ID" ]; then
            DATE_ID=$(date -u -d '+10 days' '+%Y-%m-%d' 2>/dev/null || date -u -v+10d '+%Y-%m-%d')
          fi
          echo "Date ciblée : $DATE_ID"
          curl -sS -X POST ${{ secrets.APP_URL }}/api/admin/send-lieu \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg d "$DATE_ID" --arg s '${{ secrets.ADMIN_SECRET }}' '{dateId: $d, adminSecret: $s}')"
